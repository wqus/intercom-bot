services:
  bot:
      build: .
      container_name: support-stats-bot
      restart: unless-stopped
      env_file:
        - .env
      volumes:
        - ./credentials:/app/credentials:ro
      depends_on:
        db:
          condition: service_healthy

networks:
  intercom-network:
    external: true
    name: intercom_intercom-network  